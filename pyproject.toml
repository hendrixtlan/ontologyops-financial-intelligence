[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ontologyops-financial-intelligence"
version = "0.1.0"
description = "Ontology-grounded financial intelligence with executable semantic drift regression"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0,<7"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
genie = ["mcp>=1.0,<3.0"]

[project.scripts]
ontologyops = "ontologyops.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
