bundle:
  name: ontologyops_financial_intelligence

include:
  - resources/*.yml

# Databricks Declarative Automation Bundle (formerly Asset Bundle).
# Requires CLI authentication and a UC volume with the generated JSONL uploaded.
variables:
  input_path:
    description: Governed Unity Catalog Volume path containing synthetic JSONL
    default: /Volumes/main/ontologyops/landing/raw_payment_events.jsonl
  kafka_bootstrap:
    description: Private Azure-reachable Kafka bootstrap servers (never localhost)
    default: "CHANGE_ME_KAFKA_BROKER:9093"
  kafka_sasl_jaas:
    description: Sensitive Kafka SASL JAAS configuration (inject securely; never commit)
    default: "CHANGE_ME_FROM_SECRET_MANAGER"

resources:
  jobs:
    ontologyops_reference_snapshot:
      name: ontologyops-reference-snapshot-${bundle.target}
      tasks:
        - task_key: build_payment_lakehouse
          notebook_task:
            notebook_path: ./databricks/ingest_and_build.py
            base_parameters:
              input_path: ${var.input_path}
              catalog: main
              schema: ontologyops

# Target host is inherited from the Databricks CLI profile.
targets:
  dev:
    default: true
    mode: development
  prod:
    mode: production
